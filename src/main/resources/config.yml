# Internal config schema version. Do not edit manually.
config-version: 2

# ─── Vault Settings ──────────────────────────────────────────────────────
vault-settings:
  # Number of rows per vault page (1-6)
  rows: 6
  # Total number of pages per vault
  total-pages: 2
  # Title shown when opening a vault. %page% = current page number
  title: "Vault %page%"

# ─── Update Checker ──────────────────────────────────────────────────────
update-checker:
  # Enable/disable the Modrinth update checker entirely
  enabled: true
  # Which release channel to notify about: release, beta, alpha or all
  channel: "release"
  # Log an update notice to the console when one is found
  notify-console: true
  # Notify players with permission (or OP) when they join
  notify-ops-on-join: true
  # Permission node required to receive join notifications
  notify-permission: "vaults.update"

# ─── Messages ────────────────────────────────────────────────────────────
# All messages use legacy color codes (&a, &c, etc.).
# The prefix is prepended to every chat message (leave empty for none).
messages:
  prefix: "&8[&6Vaults&8] "

  # Chat messages
  player-offline: "&cPlayer is offline."
  vault-shared: "&aVault shared with &e%player%"
  vault-unshared: "&aRevoked &e%player%&a's access."
  share-already: "&e%player% &calready has access."
  share-self: "&cYou can't share your vault with yourself."
  unshare-none: "&e%player% &7doesn't have access."
  no-permission: "&cYou don't have permission."
  vault-load-failed: "&cFailed to load vault. Please try again."

  # Shared list
  shared-list-header: "&eVault access:"
  shared-list-entry: "&7- &f%player%"
  shared-list-empty: "&7- (none)"

  # Admin command (/vaultadmin)
  admin-usage: "&cUsage: /vaultadmin <open|shares|unshare|clear|reload|info> ..."
  admin-player-only: "&cThis subcommand must be run by a player."
  admin-opened: "&aOpened &f%player%&a's vault (page %page%)."
  admin-shares-header: "&eShares for &f%player%&e:"
  admin-shares-guests: "&7- shared with &f%player%"
  admin-shares-owners: "&7- shared to them by &f%player%"
  admin-shares-none: "&7- (none)"
  admin-unshared: "&aRevoked &f%guest%&a's access to &f%owner%&a's vault."
  admin-unshare-none: "&e%guest% &7had no access to &f%owner%&7's vault."
  admin-cleared: "&aCleared &e%count% &apage(s) for &f%player%&a."
  admin-clear-confirm: "&cRun &f/vaultadmin clear %player% all confirm &cto wipe all pages."
  admin-reloaded: "&aConfiguration reloaded."
  admin-reload-failed: "&cReload failed. Check the console for details."
  admin-info-header: "&eVault info for &f%player%&e:"
  admin-info-pages: "&7- Pages: &f%pages%"
  admin-info-storage: "&7- Storage: &f%kb% KB"
  admin-info-shares: "&7- Shares out: &f%guests%&7, in: &f%owners%"

  # Navigation buttons (these do NOT get the prefix)
  nav-next: "&eNext →"
  nav-prev: "&e← Prev"

  # Update checker
  update-available: "&eA new version of Vaults is available: &f%version% &7(you have %current%)"
  update-download: "&7Download: &bhttps://modrinth.com/plugin/vaults"
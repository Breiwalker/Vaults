name: Vaults
version: ${version}
main: com.BreiwalkerSMP.Vaults.Vaults
api-version: '1.21.11'
authors: [Breiwalker]
folia-supported: true

libraries:
  - org.xerial:sqlite-jdbc:3.46.0.0

commands:
  vault:
    description: Open your vault
    usage: /vault [share|unshare|shared|<player>]
  vaultadmin:
    description: Manage Vaults
    aliases: [va]
    usage: /vaultadmin <open|shares|unshare|clear|reload|info> ...
    permission: vaults.admin
permissions:
  vaults.admin:
    description: Manage any player's vault and shares
    default: op
  vaults.update:
    description: Receive update notifications
    default: op